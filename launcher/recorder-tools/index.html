<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src blob:; media-src blob:; connect-src 'none'">
<title>Game recordings · Offline video player</title>
<style>html,body{margin:0;background:#f1f3ee;font:15px system-ui;color:#182015}main{max-width:1080px;margin:4vh auto;padding:24px}h1{font-size:28px}p{line-height:1.6;color:#46503f}input,button,select{font:inherit;max-width:100%}input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #286838;outline-offset:4px}video{width:100%;max-height:65vh;background:#172216;margin:18px 0;border-radius:5px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{padding:8px 12px;background:#fafbf8;color:#182015;border:1px solid #aebaa4;border-radius:5px;cursor:pointer}#moments{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}[hidden]{display:none!important}</style>
</head><body>
<!-- Local playback of actual exported video bytes, never a reconstructed pitch. -->
<main><h1>Watch a saved game video</h1><p>Open a previously saved <strong>WebM video</strong>. Optionally load its timestamps file to jump straight to marked moments. Files stay on this computer; this player does not connect to Discord.</p>
<label for="file">Video file</label><p><input id="file" type="file" accept=".webm,video/webm"></p>
<label for="sidecar">Optional moments file</label><p><input id="sidecar" type="file" accept=".json,application/json"></p>
<video id="video" controls playsinline hidden aria-label="Saved game video"></video>
<div class="row"><button id="back">Back 5s</button><button id="forward">Forward 5s</button><label for="speed">Speed</label><select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
<div id="moments" aria-label="Saved video timestamps"></div>
<p id="message" role="status" aria-live="polite">Previously exported files only. This page cannot record or read a live match.</p></main>
<script src="video_offline.js"></script>
</body></html>

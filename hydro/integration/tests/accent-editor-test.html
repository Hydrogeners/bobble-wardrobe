<!doctype html><meta charset="utf-8"><title>Accent editor regression</title>
<iframe src="showroom-fixture.html" style="width:985px;height:719px"></iframe><pre id="result">Waiting</pre>
<script>
const timer=setInterval(()=>{const w=document.querySelector('iframe').contentWindow;if(!w.__bobbleWardrobe?.preview())return;clearInterval(timer);const r=w.document.querySelector('#bobble-wardrobe').shadowRoot,$=s=>r.querySelector(s),assert=(v,m)=>{if(!v)throw Error(m)};
try{const initial=w.__bobbleAccentSettings.arrow;$('#aim-color').value='#ff1122';$('#aim-color').dispatchEvent(new w.Event('input'));assert(w.__bobbleWardrobe.preview().accents.arrow==='#ff1122','draft preview');assert(w.__bobbleAccentSettings.arrow===initial,'draft must not apply');assert(!$('#apply-accents').disabled,'apply enabled');$('#apply-accents').click();assert(w.__bobbleAccentSettings.arrow==='#ff1122','explicit apply');assert($('#apply-accents').disabled,'applied button disabled');$('[data-preset="aurora"]').click();assert(w.__bobbleWardrobe.preview().accents.halo==='#9865d9','preset preview');assert(w.__bobbleAccentSettings.arrow==='#ff1122','preset not applied');$('#reset-accents').click();assert(w.__bobbleWardrobe.preview().accents.halo==='#19b9ce','reset preview');const yaw=w.__bobbleWardrobe.preview().yaw;$('#halo-color').value='#667788';$('#halo-color').dispatchEvent(new w.Event('input'));assert(w.__bobbleWardrobe.preview().yaw===yaw,'orbit preserved');w.__bobbleWardrobe.hide();assert(!w.__bobbleWardrobe.preview().visible,'closed viewer paused');document.querySelector('#result').textContent='PASS: draft isolation, explicit apply, presets, reset, orbit preservation, close pause';}catch(e){document.querySelector('#result').textContent='FAIL: '+e.stack;}
},100);setTimeout(()=>{clearInterval(timer);if(document.querySelector('#result').textContent==='Waiting')document.querySelector('#result').textContent='FAIL: initialization timeout';},8000);
</script>

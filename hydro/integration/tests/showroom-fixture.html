<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wardrobe showroom UI fixture</title>
<style>body{margin:0;background:#222b24;color:#d1ddca;font:13px system-ui}p{max-width:30ch;padding:12px}</style>
<p>UI test fixture. Real authored model; simulated club state. Not a game screenshot.</p>
<script src="../club-catalog.js"></script><script src="../skin-accents.js"></script><script src="../skin-preview.js"></script>
<script type="module">
const names=['hydro','miko','todo','jjcho','augusto','flair','supa','duolingo','spark'];
const data=await Promise.all(names.map(id=>fetch('../visual-'+id+'-quality.json').then(r=>r.json())));
const hydro=data[0];window.__bobbleSkinAssets=Object.fromEntries(names.map((id,i)=>[id,data[i]]));
window.__bobbleSkinCatalog=names.map(id=>({id,name:id==='hydro'?'Hydro':id==='spark'?'Spark':id.toUpperCase(),description:id==='augusto'?'Pearl cloak, ornate crown & gold chest panel':'Reference-led quality model · local cosmetic'}));
const clubs=['Bear','Tiger','Bull','Dino','Hawk','Pig','Bug'],listeners=new Set();
let state={enabled:false,remember:false,assignments:Object.fromEntries(clubs.map(c=>[c,'original'])),counts:Object.fromEntries(clubs.map(c=>[c,0])),attached:0,failures:[],catalog:window.__bobbleSkinCatalog};
const emit=()=>{for(const fn of listeners)fn(structuredClone(state));};
window.__bobbleWardrobeEngine={clubs,state:()=>structuredClone(state),subscribe(fn){listeners.add(fn);fn(state);return()=>listeners.delete(fn)},auto(id){state.autoSkin=id;emit()},previewData:id=>window.__bobbleSkinAssets[id]||hydro,assign(c,s){state.assignments[c]=s;emit()},assignAll(s){for(const c of clubs)state.assignments[c]=s;emit()},setEnabled(v){state.enabled=v;emit()},remember(v){state.remember=v;emit()},restore(){state.enabled=false;state.attached=0;emit();return true},reset(){state.enabled=false;for(const c of clubs)state.assignments[c]='original';emit()},retry(){state.failures=[];emit()},dispose(){return true}};
window.__addFixtureSkin=()=>{state.catalog.push({id:'test-second-entry',name:'TEST: second entry',description:'Synthetic catalog entry for carousel tests only'});emit();};
const script=document.createElement('script');script.src='../skin-showroom.js';script.onload=()=>window.__bobbleWardrobe.show();document.head.append(script);
</script>

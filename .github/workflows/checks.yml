name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r launcher/requirements-build.txt
      - name: Wardrobe checks
        working-directory: hydro/integration
        shell: pwsh
        run: |
          node preview-test.cjs --quality
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node visual-test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node wardrobe-test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node aim-accent-test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node compact-geometry-test.cjs --quality
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node fitted-bundle-test.cjs --quality
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BOBBLE_ASSET_VARIANT='quality'
          python -m unittest -v test_visual_envelope.py test_nebula_rig.py test_fitted_assets.py test_base_styles.py test_native_scale.py
      - name: Build and isolated helper lifecycle
        working-directory: launcher
        shell: pwsh
        run: ./build.ps1
